[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "causalmemory"
version = "0.1.0"
description = "CausalMemory - Fact memory with cause-effect chains derived at query time"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
